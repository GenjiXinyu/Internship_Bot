# General settings. Personal details are NOT stored here, because this repo is
# public. They are GitHub repository secrets (see README.md):
#   EMAIL_TO                     where alerts are sent
#   SHEET_ID                     the tracker's ID (docs.google.com/spreadsheets/d/<ID>/edit)
#   GMAIL_APP_PASSWORD           lets the bot send email from your Gmail
#   GOOGLE_SERVICE_ACCOUNT_JSON  lets the bot edit the tracker

sheet:
  tab: Sheet1
  seen_tab: Seen Postings
  new_status: Not yet Applied

timezone: America/Los_Angeles

# A role you've already been sent counts as reposted (and gets a new "(reposted)" row)
# when it had been gone from the job board for at least this many days and comes back
# with a new posting ID.
repost_after_days: 2

# Backup source used for every company (see companies.yaml)
simplify_url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json
