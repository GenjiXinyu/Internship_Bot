# Companies the bot watches.
#
# Each company has one or more sources. Supported source types:
#   greenhouse: board token        (boards-api.greenhouse.io)
#   lever:      site name          (api.lever.co)
#   ashby:      job board name     (api.ashbyhq.com)
#   workday:    {tenant, wd, site} (e.g. blueorigin.wd5.myworkdayjobs.com/BlueOrigin)
#   pinpoint:   subdomain          (xyz.pinpointhq.com)
#   rippling:   board slug         (ats.rippling.com/<slug>)
#   amazon:     search query       (amazon.jobs)
#   page:       careers page URL   (looks for links whose text mentions "intern")
#
# Put "optional: true" on a source when you are not sure it exists. A failing
# optional source is only logged, not reported as broken.
#
# "simplify" lists the company name(s) as they appear in the community-maintained
# SimplifyJobs internship list. That list is used as a backup source for every
# company, and as the main source for companies whose career site cannot be read
# directly (Oracle, iCIMS, SuccessFactors, etc.). Names must match exactly.

