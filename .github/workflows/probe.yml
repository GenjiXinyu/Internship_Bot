name: Probe job boards

# One-off helper for adding companies: finds which job boards exist.
# Reads public job boards only; writes nothing.
on:
  workflow_dispatch:
    inputs:
      args:
        description: "Extra arguments for tools/probe.py"
        type: string
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tools.probe ${{ inputs.args }}
